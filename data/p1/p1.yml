character:
  name: p1
  type: player
  position:
    x_pos: 0
    y_pos: 30
    alpha: 1.0
    scale: 1
  action:
  - name: start
    trigger: NONE
    from: start
    to: idle
  - name: idle
    trigger: NONE
    from: start
    to: idle
  - name: turn
    trigger: INVERT
    from: idle,walk_back,walk_forward
    to: idle
  - name: turn_duck
    trigger: INVERT
    from: duck,duck_back
    to: duck
  - name: walk_back
    trigger: B
    from: idle
    to: idle
  - name: walk_forward
    trigger: F
    from: idle
    to: idle
  - name: stop_walk
    trigger: ~F,~B
    from: walk_forward,walk_back,run
    to: idle
  - name: run
    trigger: Run
    from: idle,walk_forward,walk_back
    to: idle
  - name: start_duck
    trigger: DB,D
    from: idle,walk_back,walk_forward
    to: duck
  - name: end_duck
    trigger: NONE,~D
    from: duck,duck_back
    to: idle
  - name: duck
    trigger: D
    from: duck_back
    to: idle
  - name: duck_back
    trigger: DB
    from: duck
    to: idle
  - name: duck_punch
    trigger: LP
    from: duck,duck_back
    to: '*previous'
  - name: jump
    trigger: U
    from: idle,walk_back,walk_forward,duck
    to: idle
  - name: jump_forward
    trigger: UF
    from: idle,walk_forward,duck,run
    to: idle
  - name: jump_forward
    trigger: U
    from: walk_forward
    to: idle
  - name: jump_back
    trigger: UB
    from: idle,walk_back,duck
    to: idle
  - name: jump_back
    trigger: U
    from: walk_back
    to: idle
  - name: block_low
    trigger: HIT_L,HIT_M
    from: duck_back
    to: duck_back
  - name: block_high
    trigger: HIT_H,HIT_M
    from: walk_back
    to: idle
  - name: hurt_low
    trigger: HIT_L
    from: idle,walk_back,duck,dash_forward,dash_back,fireball,1punch,2punch,kick,back_kick
    to: idle
  - name: hurt_mid
    trigger: HIT_M
    from: idle,walk_forward,dash_back,dash_forward,fireball,1punch,2punch,kick,back_kick
    to: idle
  - name: hurt_high
    trigger: HIT_H
    from: idle,duck,duck_back,walk_forward,dash_back,dash_forward,fireball,1punch,2punch,kick,back_kick
    to: idle
  - name: hurt_air
    trigger: HIT_L,HIT_M,HIT_H
    from: knocked_down,jump,jump_back,jump_forward,hurt_air,thrown
    to: ground
  - name: dash_back
    trigger: BK_BK
    from: idle,walk_back
    to: idle
  - name: dash_forward
    trigger: FW_FW
    from: idle,walk_forward
    to: idle
  - name: 1punch
    trigger: LP
    from: idle,walk_back,walk_forward,run
    to: idle
  - name: 2punch
    trigger: MP
    from: idle,walk_back,walk_forward,1punch
    to: idle
  - name: back_kick
    trigger: MK
    from: idle,walk_back,walk_forward
    to: idle
  - name: kick
    trigger: LK
    from: idle,walk_back,walk_forward,2punch
    to: idle
  - name: grab
    trigger: GB
    from: idle,walk_forward,walk_back
    to: idle
  - name: throw
    trigger: THROW
    from: grab
    to: idle
  - name: thrown
    trigger: THROWN
    from: thrown,idle,walk_back,walk_forward
    to: ground
  - name: knocked_down
    trigger: KNOCK_DOWN
    from: idle,knocked_down
    to: idle
  - name: hit_ground
    trigger: GROUND
    from: thrown,hurt_air,knocked_down
    to: ground
  - name: land
    trigger: GROUND
    from: jump,jump_back,jump_forward,jump_kick
    to: idle
  - name: ground
    trigger: ''
    from: thrown
    to: stand
  - name: stand
    trigger: ''
    from: thrown
    to: idle
  - name: jump_kick
    trigger: LK
    from: jump,jump_forward,jump_back
    to: '*previous'
  - name: fireball
    trigger: QCF_LP
    from: idle,walk_forward,duck,start_duck,end_duck,1punch
    to: idle
